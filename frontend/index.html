<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReWear Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe2; --surface:#fdfaf3; --ink:#5b5048; --ink-strong:#4a3f37; --muted:#a99c8a;
  --cherry:#bd7a72; --cherry-d:#a8655d; --pink:#d9a7a0; --pink-soft:#f1e3dc;
  --sage:#9aad86; --sage-d:#879a73; --sage-soft:#e8efdf;
  --lav:#c3b4df; --lav-soft:#ece6f4; --gold:#d6b574; --blue:#9fbbd2;
  --cream:#f3ecdd; --lilac:#ece6f4; --mint:#e9efe1;
  --line:#e7dcc8; --line-soft:#efe8d9;
  --r:20px; --r-sm:14px;
  --shadow:0 12px 30px -14px rgba(120,95,70,.32);
  --shadow-sm:0 5px 16px -8px rgba(120,95,70,.26);
  --sans:'Mulish',system-ui,sans-serif; --display:'Fraunces','Georgia',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle at 12% 0%,#faf4e9 0,transparent 42%),radial-gradient(circle at 92% 4%,#f2ece0 0,transparent 40%);
  background-attachment:fixed;}
/* doodles dibujados a mano, de fondo */
.doodles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.doodles svg{position:absolute;opacity:.5}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;color:var(--ink)}
a{color:var(--cherry);text-decoration:none}
button{font-family:inherit}
img{max-width:100%}

/* ---- layout ---- */
.wrap{max-width:1080px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,239,226,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:25px;letter-spacing:.01em}
.brand .nm{color:var(--ink-strong)}
.brand svg{width:28px;height:28px;flex:none}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.nav button{border:1.5px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button.on{background:var(--sage-soft);color:var(--sage-d);border-color:#cbddb8}
.nav .saldo{background:var(--surface);border:1.5px solid var(--line);color:var(--cherry);padding:6px 13px;border-radius:999px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px}
.nav .salir{color:var(--muted)}

/* ---- pieces ---- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:20px}
.grid{display:grid;gap:16px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:800;font-size:15px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.p{background:var(--sage);color:#fdfbf4;box-shadow:var(--shadow-sm)}
.btn.p:hover{background:var(--sage-d)}
.btn.g{background:var(--pink-soft);color:var(--cherry-d)}
.btn.g:hover{background:#ecd8d0}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:13px}
label.f{display:block;margin:0 0 11px;font-weight:700;font-size:14px;color:var(--ink)}
label.f span{display:block;color:var(--muted);font-weight:600;font-size:12.5px;margin-bottom:4px}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.tag{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:11.5px;padding:3px 10px;border-radius:999px;letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--pink-soft);color:var(--cherry);border-radius:999px;padding:4px 11px;font-weight:700;font-size:13px}
.msg{border-radius:var(--r-sm);padding:10px 13px;font-weight:700;font-size:14px;margin-top:4px}
.msg.ok{background:var(--mint);color:#1f7a53}
.msg.err{background:#ffe2e6;color:var(--cherry-d)}
.muted{color:var(--muted)}
.coin{width:16px;height:16px;display:inline-block;vertical-align:-3px}
hr.soft{border:0;border-top:1px solid var(--line-soft);margin:16px 0}
table.data{width:100%;border-collapse:collapse;font-size:14.5px}
table.data th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.data td{padding:10px;border-bottom:1px solid var(--line-soft)}

/* rareza + estado colors */
.r-Comun{background:#eae3d6;color:#8c7d6b}.r-Raro{background:#e0ebf0;color:#5f87a0}
.r-Epico{background:#eae3f2;color:#8a6fb0}.r-Legendario{background:#f3e8cf;color:#b19152}
.tag{border:1px solid rgba(120,95,70,.08)}
.e-en_revision{background:#f3e8cf;color:#a9823b}.e-disponible{background:var(--sage-soft);color:#5f7a4c}
.e-reservada{background:#f3e8cf;color:#a9823b}.e-enviada{background:#e0ebf0;color:#5f87a0}.e-entregada{background:var(--sage-soft);color:#5f7a4c}.e-retirada{background:#f1e0dc;color:var(--cherry-d)}.e-cancelada{background:#eae3d6;color:#8c7d6b}

/* prenda card */
.prenda{overflow:hidden;padding:0;display:flex;flex-direction:column}
.prenda .foto{height:230px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px;color:#fff;position:relative}
.foto-ht::after{content:none}
.prenda .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.prenda h4{font-size:16px}
.prenda .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-family:var(--display);font-weight:700;font-size:19px;color:var(--cherry);display:flex;align-items:center;gap:5px}
.lock{position:absolute;inset:0;background:rgba(62,34,48,.46);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;gap:6px;flex-direction:column}

/* hero / landing */
.hero{text-align:center;padding:46px 0 10px;position:relative}
.hero h1{font-size:clamp(36px,6.4vw,62px);letter-spacing:-.02em}
.hero h1{font-weight:600}
.hero h1 em{font-style:italic;color:var(--cherry)}
.hero p{max-width:560px;margin:16px auto 24px;color:var(--muted);font-size:18px;font-weight:600}
.hero .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.collage{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:40px 0}
.collage .chip{width:150px;height:180px;border-radius:var(--r);display:flex;align-items:flex-end;padding:14px;color:#fff;font-family:var(--display);font-weight:600;font-size:15px;box-shadow:var(--shadow);transform:rotate(var(--rot))}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:30px 0 50px}
.feat .card{text-align:center}
.feat .em{font-size:30px}

.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 16px}
.section-title h2{font-size:26px}
.section-title h2::before{content:"\2726";color:var(--gold);margin-right:9px;font-size:.72em;vertical-align:3px}
.bignum{color:var(--cherry)}
.section-title .sub{color:var(--muted);font-weight:700}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.filtros .fi{min-width:130px}
.filtros .fi label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.filtros select{padding:8px 10px;font-size:14px}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 13px}
.chk input{width:auto}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(62,34,48,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal{background:#fff;border-radius:24px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:26px;box-shadow:var(--shadow)}
.modal .x{float:right;border:0;background:var(--pink-soft);color:var(--cherry);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;font-weight:800}
.breakdown{background:var(--lilac);border-radius:var(--r-sm);padding:14px 16px;font-weight:700}
.breakdown .ln{display:flex;justify-content:space-between;padding:3px 0;color:#5a4a6e}
.breakdown .tot{border-top:1.5px dashed #c9b8ff;margin-top:6px;padding-top:8px;color:var(--ink);font-size:17px}

/* compare bar */
.cmpbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 10px 9px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:40;font-weight:700}
.escalera{display:flex;gap:10px;flex-wrap:wrap}
.escalera .niv{flex:1;min-width:120px;border-radius:var(--r-sm);padding:12px;text-align:center;border:1.5px solid var(--line)}
.escalera .niv.off{opacity:.55}
.bignum{font-family:var(--display);font-weight:700;font-size:40px;color:var(--cherry);line-height:1}
@media(max-width:560px){.nav .lbl{display:none}.topbar .wrap{height:56px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ========== utilidades ========== */
let TOKEN = localStorage.getItem('rw_token') || '';
async function api(path, method='GET', body){
  const h={'Content-Type':'application/json'};
  if(TOKEN) h.Authorization='Bearer '+TOKEN;
  const r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  let d={}; try{d=await r.json();}catch(e){}
  return {ok:r.ok,status:r.status,data:d};
}
const Coin = ({s=16}) => (
  <svg className="coin" width={s} height={s} viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="10" fill="#ffd36b" stroke="#e8a92c" strokeWidth="1.5"/>
    <path d="M12 7v10M9 9.5c0-1.1 1.3-2 3-2s3 .9 3 2-1.3 2-3 2-3 .9-3 2 1.3 2 3 2 3-.9 3-2" stroke="#e8a92c" strokeWidth="1.3" strokeLinecap="round"/>
  </svg>
);
const Money = ({n}) => <span className="price"><Coin/>{n}</span>;
// Logo: un gancho de ropa con el gancho en forma de corazon (cute y legible).
const Logo = ({c='#c0837b'}) => (
  <svg viewBox="0 0 48 48" fill="none">
    <path d="M24 20.5C24 20.5 16 15.4 16 10.8 16 8.4 17.9 6.9 19.9 6.9 21.6 6.9 23.1 8 24 9.6 24.9 8 26.4 6.9 28.1 6.9 30.1 6.9 32 8.4 32 10.8 32 15.4 24 20.5 24 20.5Z" fill={c}/>
    <path d="M24 20.5 L24 23 M10 33 L24 22.4 L38 33 M8.8 33 H39.2" stroke={c} strokeWidth="3.1" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
// Ilustraciones de prenda por categoria (gráficos originales, hacen de "foto").
const palettes=[{bg:'#f3e3df',ink:'#c98a82'},{bg:'#ece6f4',ink:'#9d87c4'},{bg:'#eaefe0',ink:'#8aa06c'},
  {bg:'#f1e9da',ink:'#c2a06a'},{bg:'#e3ecf2',ink:'#7f9cb8'},{bg:'#f5e6ec',ink:'#cc8ba6'}];
const paleta = id => palettes[(id||0) % palettes.length];
const garments={
  camiseta:'M30 30 L19 39 L26 48 L31 44 L31 82 L69 82 L69 44 L74 48 L81 39 L70 30 C66 38 59 41 50 41 C41 41 34 38 30 30 Z',
  chaqueta:'M30 30 L19 39 L26 48 L31 44 L31 82 L47 82 L47 41 C42 40 37 37 34 31 Z M66 31 C63 37 58 40 53 41 L53 82 L69 82 L69 44 L74 48 L81 39 L70 30 Z',
  vestido:'M36 30 L29 39 L35 47 L39 44 L39 50 L26 84 L74 84 L61 50 L61 44 L65 47 L71 39 L64 30 C60 37 55 40 50 40 C45 40 40 37 36 30 Z',
  pantalon:'M32 29 L68 29 L66 84 L54 84 L50 52 L46 84 L34 84 Z',
  zapatos:'M20 64 C20 59 24 56 30 56 L41 56 L48 50 L55 57 L72 61 C78 62 82 65 82 69 L82 72 L20 72 Z',
  cartera:'M28 46 L72 46 L68 84 L32 84 Z M36 46 C36 32 41 25 50 25 C59 25 64 32 64 46 L59 46 C59 35 55 30 50 30 C45 30 41 35 41 46 Z',
};
function artePath(cat){const k=(cat||'').toLowerCase();
  if(k.includes('camiseta')||k.includes('top')||k.includes('blusa'))return garments.camiseta;
  if(k.includes('chaqueta'))return garments.chaqueta;
  if(k.includes('vestido'))return garments.vestido;
  if(k.includes('pantal')||k.includes('jean'))return garments.pantalon;
  if(k.includes('zapato')||k.includes('sneaker')||k.includes('calzado'))return garments.zapatos;
  if(k.includes('cartera')||k.includes('bolso')||k.includes('accesorio'))return garments.cartera;
  return garments.camiseta;}
function PrendaArte({categoria,id,imagen}){const p=paleta(id);
  if(imagen) return (
    <div style={{height:'100%',width:'100%',overflow:'hidden',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <img src={imagen} alt={categoria||'prenda'} style={{width:'100%',height:'100%',objectFit:'contain',display:'block',padding:6,boxSizing:'border-box'}}/>
    </div>
  );
  return (
  <div style={{height:'100%',width:'100%',display:'flex',alignItems:'center',justifyContent:'center',background:p.bg}}>
    <svg width="50%" viewBox="0 0 100 100" style={{filter:'drop-shadow(0 4px 7px rgba(120,95,70,.14))'}}>
      <path d={artePath(categoria)} fill={p.ink}/>
    </svg>
  </div>
);}
const Star = ({c='#d6b574',s=16,style}) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill={c} style={style}><path d="M12 0c.7 6.3 5 10.6 12 12-7 1.4-11.3 5.7-12 12-.7-6.3-5-10.6-12-12C7 10.6 11.3 6.3 12 0z"/></svg>
);
// Doodles dibujados a mano (ganchos, corazones, ramitas) para el fondo.
const DL={
  hanger:'M20 6.2c-1.5 0-2.5 1-2.5 2.3 0 1 .6 1.6 1.3 1.9 M18.8 10.4 L5 19 H35 L21.2 10.4',
  heart:'M12 20.5C5.5 15.8 3 12 3 8.4 3 5.8 5 4 7.3 4 9 4 10.6 5 11.3 6.4 12 7.8 12.7 7 14.7 6c.7-1.4 2.3-2 4-2C17 4 19 5.8 19 8.4c0 3.6-2.5 7.4-9 12.1Z',
  sprig:'M6 23C9 14 13 8 21 4 M11 16c-3-1.2-5.2 0-6.2 2.2 M15 10.5c-2.8-1.2-5 0-6 2.2 M18 6.5c-2.4-1-4.3 0-5.2 2',
};
const Doodle=({t='hanger',c='#cbb799',w=42,style})=>(
  <svg width={w} viewBox="0 0 40 28" fill="none" stroke={c} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={style}><path d={DL[t]}/></svg>
);
function Doodles(){return(
  <div className="doodles">
    <Doodle t="heart" w={26} style={{top:'10%',left:'4%',transform:'rotate(-8deg)'}}/>
    <Doodle t="hanger" w={46} style={{top:'22%',left:'7%',transform:'rotate(-12deg)'}}/>
    <Doodle t="sprig" w={34} style={{top:'52%',left:'3%',transform:'rotate(6deg)'}}/>
    <Doodle t="heart" w={20} style={{top:'74%',left:'8%'}}/>
    <Doodle t="hanger" w={40} style={{top:'14%',right:'6%',transform:'rotate(10deg)'}}/>
    <Doodle t="sprig" w={30} style={{top:'8%',right:'14%',transform:'scaleX(-1) rotate(8deg)'}}/>
    <Doodle t="heart" w={24} style={{top:'40%',right:'4%',transform:'rotate(10deg)'}}/>
    <Doodle t="hanger" w={44} style={{bottom:'10%',right:'7%',transform:'rotate(-8deg)'}}/>
    <Doodle t="sprig" w={32} style={{bottom:'8%',left:'12%',transform:'scaleX(-1)'}}/>
  </div>
);}
const rarezaTag = r => <span className={"tag r-"+(r||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}>{r}</span>;
const EST_LBL={en_revision:'en revisión'};
const estadoTag = e => <span className={"tag e-"+e}>{EST_LBL[e]||e.replace('_',' ')}</span>;
function Mensaje({m}){ return m ? <div className={"msg "+m.t}>{m.x}</div> : null; }

/* dropdown que muestra nombre y guarda id */
const Opts = ({lista,vacio='-- elegir --'}) => (
  <React.Fragment><option value="">{vacio}</option>
    {lista.map(o=><option key={o.id??o} value={o.id??o}>{o.nombre??o}</option>)}
  </React.Fragment>
);

/* ========== LANDING ========== */
function Landing({onEntrar}){
  const chips=[['Vestido','-6deg'],['Chaqueta','4deg'],['Pantalón','-3deg'],['Zapatos','6deg']];
  return <div className="wrap">
    <div className="hero">
      <Star c="#cf9a93" s={24} style={{position:'absolute',left:'15%',top:40}}/>
      <Star c="#9fbbd2" s={17} style={{position:'absolute',right:'17%',top:94}}/>
      <Star c="#c3b4df" s={15} style={{position:'absolute',right:'27%',top:32}}/>
      <Doodle t="heart" w={28} c="#cf9a93" style={{position:'absolute',left:'24%',top:150,transform:'rotate(-6deg)'}}/>
      <div style={{width:78,height:78,margin:'0 auto 8px'}}><Logo/></div>
      <h1>Tu estilo es tu <em>moneda</em> <Star c="#d6b574" s={30} style={{verticalAlign:'middle'}}/></h1>
      <p>Dale una segunda vida a lo que ya no usas: ropa, carteras y más. Entrega tus piezas, gana créditos y descubre cosas únicas de la comunidad ReWear.</p>
      <div className="cta">
        <button className="btn p" onClick={()=>onEntrar('registro')}>Crear mi cuenta</button>
        <button className="btn g" onClick={()=>onEntrar('login')}>Ya tengo cuenta</button>
      </div>
    </div>
    <div className="collage">
      {chips.map(([t,r],i)=><div key={t} className="chip" style={{'--rot':r,background:paleta(i).bg,padding:0,flexDirection:'column',alignItems:'stretch',overflow:'hidden'}}>
        <div style={{flex:1}}><PrendaArte categoria={t} id={i}/></div>
        <div style={{padding:'9px 0',textAlign:'center',fontWeight:700,fontSize:15,color:paleta(i).ink,background:'#fff'}}>{t}</div>
      </div>)}
    </div>
    <div className="feat">
      <div className="card"><div style={{height:34,marginBottom:4}}><Doodle t="hanger" w={46} c="#c58a82"/></div><h3>Entrega</h3><p className="muted">Sube tu prenda y el equipo valida su estado real antes de darte créditos.</p></div>
      <div className="card"><div style={{height:34,marginBottom:4}}><Doodle t="heart" w={30} c="#cf9a93"/></div><h3>Gana créditos</h3><p className="muted">Cada prenda vale según su categoría, estado y marca. Más un bono de bienvenida.</p></div>
      <div className="card"><div style={{height:34,marginBottom:4}}><Star c="#d6b574" s={30}/></div><h3>Desbloquea</h3><p className="muted">Sube de nivel y abre drops exclusivos y prendas raras por temporada y estilo.</p></div>
    </div>
  </div>;
}

/* ========== AUTH ========== */
function Auth({modo,setModo,onOk}){
  const [f,setF]=useState({correo:'',contrasena:'',nombre:'',apellido:''});
  const [msg,setMsg]=useState(null);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  async function enviar(){
    setMsg(null);
    const path=modo==='registro'?'/api/registro':'/api/login';
    const {ok,data}=await api(path,'POST',f);
    if(!ok) return setMsg({t:'err',x:data.error});
    onOk(data);
  }
  return <div className="wrap" style={{maxWidth:430,marginTop:40}}>
    <div className="card">
      <h2 style={{marginBottom:4}}>{modo==='registro'?'Crear cuenta':'Iniciar sesión'}</h2>
      <p className="muted" style={{marginTop:0,marginBottom:18}}>{modo==='registro'?'Únete a la comunidad de moda circular.':'Qué bueno verte de nuevo.'}</p>
      {modo==='registro'&&<div style={{display:'flex',gap:10}}>
        <label className="f" style={{flex:1}}><span>Nombre</span><input value={f.nombre} onChange={e=>set('nombre',e.target.value)}/></label>
        <label className="f" style={{flex:1}}><span>Apellido</span><input value={f.apellido} onChange={e=>set('apellido',e.target.value)}/></label>
      </div>}
      <label className="f"><span>Correo</span><input value={f.correo} onChange={e=>set('correo',e.target.value)} placeholder="tu@correo.com"/></label>

/* ========== DETALLE ========== */
function Detalle({id,cerrar,onReservado}){
  const [p,setP]=useState(null);const [msg,setMsg]=useState(null);const [load,setLoad]=useState(false);
  const [metodo,setMetodo]=useState('retiro');const [direccion,setDireccion]=useState('');
  useEffect(()=>{api('/api/prendas/'+id).then(r=>r.ok&&setP(r.data));},[id]);
  async function reservar(){
    if(metodo==='envio'&&direccion.trim().length<5){setMsg({t:'err',x:'Escribe tu dirección de envío.'});return;}
    setLoad(true);setMsg(null);
    const {ok,data}=await api('/api/prendas/'+id+'/reservar','POST',{metodo_entrega:metodo,direccion});
    setLoad(false);
    if(!ok) return setMsg({t:'err',x:data.error});
    setMsg({t:'ok',x:'¡Reservada! Se retuvieron '+data.retenido+' créditos. Coordina la entrega en Mis reservas.'});
    onReservado&&onReservado();
  }
  if(!p) return null;
  const base=p.valor_base, est=Math.round(base*p.factor), mar=Math.round(base*p.factor*p.multiplicador);
  return <div className="overlay" onClick={cerrar}><div className="modal" onClick={e=>e.stopPropagation()}>
    <button className="x" onClick={cerrar}>×</button>
    <div style={{height:280,borderRadius:16,overflow:'hidden',marginBottom:14}}><PrendaArte categoria={p.categoria} id={p.id} imagen={p.imagen}/></div>
    <h2>{p.titulo}</h2>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',margin:'8px 0 16px'}}>
      {rarezaTag(p.rareza)}<span className="pill">Talla {p.talla}</span><span className="pill">{p.categoria}</span>
      {p.verificada&&<span className="tag" style={{background:'var(--mint)',color:'#1f7a53'}}>✓ Verificada</span>}
    </div>
    {(p.firma||p.edicion)&&<div className="tag" style={{background:'var(--gold)',color:'#5a4421',marginBottom:10,fontSize:12.5}}>✍️ {[p.firma,p.edicion].filter(Boolean).join(' · ')}</div>}
    <p className="muted" style={{marginTop:0}}>Estilo {p.estilos} · {p.temporada} · Marca {p.marca} · Color {p.color||'—'} · De {p.dueno}</p>
    <h3 style={{marginTop:18,marginBottom:8}}>{(p.firma||p.edicion)?'Pieza exclusiva':'Cómo se calcula el valor'}</h3>
    {(p.firma||p.edicion)?
    <div className="breakdown">
      <div className="ln"><span>Edición limitada</span><span>✦</span></div>
      <div className="ln"><span>Rareza {p.rareza} · cupo para desbloquear</span><span>🔒 {p.saldo_minimo} cr</span></div>
      <div className="ln tot"><span>Valor de colección</span><span><Coin/> {p.valor} créditos</span></div>
    </div>
    :
    <div className="breakdown">
      <div className="ln"><span>Valor base ({p.categoria})</span><span>{base}</span></div>
      <div className="ln"><span>× factor estado ({p.estado_prenda}, {p.factor})</span><span>{est}</span></div>
      <div className="ln"><span>× multiplicador marca ({p.marca}, {p.multiplicador})</span><span>{mar}</span></div>
      {p.verificada&&<div className="ln"><span>× 1.2 por verificación</span><span>{p.valor}</span></div>}
      <div className="ln tot"><span>Valor final</span><span><Coin/> {p.valor} créditos</span></div>
    </div>}
    <div style={{marginTop:18}}>
      {p.es_mia? <p className="muted">Esta es tu prenda.</p> :
       p.estado!=='disponible'? <p className="muted">Esta prenda ya no está disponible.</p> :
       <React.Fragment>
         {p.puedo_reservar&&<div style={{marginBottom:12}}>
           <label className="f" style={{marginBottom:8}}><span>Método de entrega</span>
             <div style={{display:'flex',gap:8}}>
               <button type="button" className={"btn sm "+(metodo==='retiro'?'p':'g')} onClick={()=>setMetodo('retiro')}>Retiro en punto</button>
               <button type="button" className={"btn sm "+(metodo==='envio'?'p':'g')} onClick={()=>setMetodo('envio')}>Envío a domicilio</button>
             </div>
           </label>
           {metodo==='envio'&&<input placeholder="Tu dirección de envío" value={direccion} onChange={e=>setDireccion(e.target.value)}/>}
         </div>}
         <button className="btn p" style={{width:'100%'}} disabled={!p.puedo_reservar||load} onClick={reservar}>
           {p.bloqueada?('Bloqueada — necesitas '+p.saldo_minimo+' créditos'):p.sin_saldo?('No te alcanza (tienes '+p.saldo+')'):'Reservar por '+p.valor+' créditos'}
         </button>
       </React.Fragment>}
      <Mensaje m={msg}/>
    </div>
  </div></div>;
}

      <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
        <label className="f" style={{flex:2,minWidth:180}}><span>Nombre</span><input value={f.nombre} onChange={e=>set('nombre',e.target.value)}/></label>
        <label className="f" style={{flex:1,minWidth:130}}><span>Nivel mínimo</span><select value={f.nivel_min_id} onChange={e=>set('nivel_min_id',e.target.value)}><Opts lista={cat.niveles}/></select></label>
      </div>
      <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
        <label className="f" style={{flex:1,minWidth:130}}><span>Temporada</span><select value={f.temporada_id} onChange={e=>set('temporada_id',e.target.value)}><Opts lista={cat.temporadas}/></select></label>
        <label className="f" style={{flex:1,minWidth:130}}><span>Estilo</span><select value={f.estilo_id} onChange={e=>set('estilo_id',e.target.value)}><Opts lista={cat.estilos}/></select></label>
        <label className="f" style={{flex:1,minWidth:130}}><span>Inicia</span><input type="date" value={f.inicia_en} onChange={e=>set('inicia_en',e.target.value)}/></label>
        <label className="f" style={{flex:1,minWidth:130}}><span>Termina</span><input type="date" value={f.termina_en} onChange={e=>set('termina_en',e.target.value)}/></label>
      </div>
      <button className="btn p" onClick={crear}>Crear drop</button><Mensaje m={msg}/>
    </div>
    <table className="data"><thead><tr><th>Drop</th><th>Nivel</th><th>Temporada</th><th>Estilo</th><th>Vigencia</th></tr></thead>
      <tbody>{l.map(c=><tr key={c.id}><td style={{fontWeight:700}}>{c.nombre}</td><td>{c.nivel_min}</td><td>{c.temporada}</td><td>{c.estilo}</td><td className="muted">{c.inicia_en} a {c.termina_en}</td></tr>)}</tbody></table>
  </div>;
}
function AdminUsuarios(){
  const [l,setL]=useState([]);
  useEffect(()=>{api('/api/admin/usuarios').then(r=>r.ok&&setL(r.data));},[]);
  return <div className="wrap"><div className="section-title"><h2>Usuarios</h2></div>
    <p className="muted" style={{marginTop:-8}}>Los usuarios se registran por su cuenta y entregan sus propias prendas. Aquí solo puedes consultarlos.</p>
    <table className="data"><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th style={{textAlign:'right'}}>Saldo</th></tr></thead>
      <tbody>{l.map(u=><tr key={u.id}><td>{u.correo}</td><td>{u.nombre} {u.apellido}</td><td>{u.rol}</td><td style={{textAlign:'right',fontWeight:800}}>{u.saldo}</td></tr>)}</tbody></table>
  </div>;
}

/* ========== APP ========== */
function App(){
  const [usuario,setUsuario]=useState(JSON.parse(localStorage.getItem('rw_user')||'null'));
  const [authModo,setAuthModo]=useState(null);
  const [view,setView]=useState('panel');
  const [cat,setCat]=useState(null);
  const [detalle,setDetalle]=useState(null);
  const [cmp,setCmp]=useState([]);
  const [verCmp,setVerCmp]=useState(false);
  const [saldo,setSaldo]=useState(null);

  const esAdmin = usuario&&usuario.rol==='admin';
  function sesionOk(data){ TOKEN=data.token; localStorage.setItem('rw_token',TOKEN); localStorage.setItem('rw_user',JSON.stringify(data.usuario));
    setUsuario(data.usuario); setAuthModo(null); setView(data.usuario.rol==='admin'?'validacion':'panel'); }
  function salir(){ api('/api/logout','POST'); TOKEN=''; localStorage.removeItem('rw_token'); localStorage.removeItem('rw_user'); setUsuario(null); setCat(null); setAuthModo(null); }
  function recargarCat(){ api('/api/catalogos').then(r=>{ if(r.ok)setCat(r.data); else if(r.status===401)salir(); }); }
  function refrescarSaldo(){ if(usuario&&usuario.rol==='user') api('/api/mi/panel').then(r=>r.ok&&setSaldo(r.data.saldo)); }
  useEffect(()=>{ if(usuario){ recargarCat(); refrescarSaldo(); } },[usuario]);
  function toggleCmp(p){ setCmp(c=>c.find(x=>x.id===p.id)?c.filter(x=>x.id!==p.id):(c.length>=3?c:[...c,p])); }

  // --- sin sesion ---
  if(!usuario){
    return <div>
      <Doodles/>
      <div className="topbar"><div className="wrap"><div className="brand"><Logo/><span className="nm">ReWear</span></div>
        <div className="nav"><button onClick={()=>setAuthModo('login')}>Ingresar</button><button className="on" onClick={()=>setAuthModo('registro')}>Crear cuenta</button></div></div></div>
      {authModo? <Auth modo={authModo} setModo={setAuthModo} onOk={sesionOk}/> : <Landing onEntrar={setAuthModo}/>}
    </div>;
  }

  const navUser=[['panel','Panel'],['catalogo','Catálogo'],['drops','Drops'],['entregar','Entregar'],['misprendas','Mis prendas'],['reservas','Mis reservas'],['ventas','Ventas'],['billetera','Billetera']];
  const navAdmin=[['validacion','Validación'],['registrar','Registrar'],['parametros','Parámetros'],['dropsadmin','Drops'],['usuarios','Usuarios']];
  const nav = esAdmin?navAdmin:navUser;

  return <div>
    <Doodles/>
    <div className="topbar"><div className="wrap">
      <div className="brand"><Logo/><span className="nm">ReWear</span> {esAdmin&&<span className="tag r-Epico" style={{fontFamily:'var(--sans)'}}>admin</span>}</div>
      <div className="nav">
        {nav.map(([k,l])=><button key={k} className={view===k?'on':''} onClick={()=>setView(k)}>{l}</button>)}
        {!esAdmin&&saldo!=null&&<span className="saldo"><Coin/>{saldo}</span>}
        <button className="salir" onClick={salir}>Salir</button>
      </div>
    </div></div>

    <div style={{padding:'22px 0 60px'}}>
      {!cat? <div className="wrap"><p className="muted">Cargando...</p></div> : <React.Fragment>
        {/* usuario */}
        {!esAdmin&&view==='panel'&&<Panel ir={setView}/>}
        {!esAdmin&&view==='catalogo'&&<Catalogo cat={cat} abrir={setDetalle} cmp={cmp} toggleCmp={toggleCmp}/>}
        {!esAdmin&&view==='drops'&&<Drops abrir={setDetalle}/>}
        {!esAdmin&&view==='entregar'&&<Entregar cat={cat}/>}
        {!esAdmin&&view==='misprendas'&&<MisPrendas/>}
        {!esAdmin&&view==='reservas'&&<MisReservas/>}
        {!esAdmin&&view==='ventas'&&<Ventas/>}
        {!esAdmin&&view==='billetera'&&<Billetera/>}
        {/* admin */}
        {esAdmin&&view==='validacion'&&<AdminValidacion cat={cat}/>}
        {esAdmin&&view==='registrar'&&<AdminRegistrar cat={cat}/>}
        {esAdmin&&view==='parametros'&&<AdminParametros cat={cat} recargar={recargarCat}/>}
        {esAdmin&&view==='dropsadmin'&&<AdminDrops cat={cat}/>}
        {esAdmin&&view==='usuarios'&&<AdminUsuarios/>}
      </React.Fragment>}
    </div>

    {detalle&&<Detalle id={detalle} cerrar={()=>setDetalle(null)} onReservado={()=>{refrescarSaldo();}}/>}
    {verCmp&&<Comparar items={cmp} cerrar={()=>setVerCmp(false)}/>}
    {!esAdmin&&cmp.length>0&&<div className="cmpbar">Comparar ({cmp.length}) <button className="btn p sm" disabled={cmp.length<2} onClick={()=>setVerCmp(true)}>Ver</button><button className="btn ghost sm" style={{color:'#fff'}} onClick={()=>setCmp([])}>Limpiar</button></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
